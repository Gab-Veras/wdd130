<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Wild Water Rafting</title>
    <meta name="description"
      content="Contact Wild Water Rafting for trip reservations, questions, and help planning your next river adventure.">
    <meta name="author" content="Gabriel Veras">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/splash-logo.png" alt="Wild Water Rafting Splash logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Contact Us</h1>
        <div class="company-informations">
            <p>Wild Water Rafting</p>
            <p>27, Elisa Bramante Francisco</p>
            <p>Sorocaba, São Paulo</p>
            <p>(15) 4002-8922</p>
            <p>helpdesk@wildwater.com</p>
        </div>

        <div class="contact-content">
            <div class="map">
                <iframe title="Map showing the Wild Water Rafting location in Sorocaba"
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3661.207650390799!2d-47.419004225255954!3d-23.416864956298408!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94cf5f1964786f29%3A0x580ab0956893da7!2sRua%20Elisa%20Bramante%20Francisco%2C%2027%20-%20%C3%89den%2C%20Sorocaba%20-%20SP%2C%2018103-080!5e0!3m2!1spt-BR!2sbr!4v1791354635662!5m2!1spt-BR!2sbr"
                  width="400" height="300" allowfullscreen loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <div class="contact-form">
                <form action="#" method="get">
                    <!-- User information -->
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" autocomplete="name">

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" autocomplete="email">

                    <!-- Purpose of the message -->
                    <fieldset>
                        <legend>Purpose of your message:</legend>
                        <label for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose" value="general">
                            General Inquiry
                        </label>
                        <label for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose"
                              value="reservation">
                            Reservation Question
                        </label>
                        <label for="purpose-suggestion">
                            <input type="radio" id="purpose-suggestion" name="purpose"
                              value="suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <!-- Message -->
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5"></textarea>

                    <!-- Newsletter checkbox -->
                    <label for="subscribe">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch</button>
                </form>
            </div>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-images">
                <figure>
                    <img src="images/employee-1.jpg" alt="John, river guide">
                    <figcaption>John - River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee-2.jpg" alt="Sandy, safety coordinator">
                    <figcaption>Sandy - Safety Coordinator</figcaption>
                </figure>

                <figure>
                    <img src="images/employee-3.jpg" alt="Billy, trip coordinator">
                    <figcaption>Billy - Trip Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Wild Water Rafting | Gabriel Veras</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube.svg" alt="YouTube Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
