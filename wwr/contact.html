<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact | Wild Water Rafting</title>
    <meta name="description" content="Contact informations about the Wild Water rafting team.">
    <meta name="author" content="Gabriel Veras">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/splash-logo.png" alt="Wild Water Rafting Splash logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="company-informations">
            <h2>Wild Water Rafting Company</h2>
            <p>27, Elisa Bramante Francisco</p>
            <p>Sorocaba, São Paulo</p>
            <p>(15) 4002-8922</p>
            <p>helpdesk@wildwhater.com</p>
        </div>

        <div class="contact-content">
            <div class="Map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3661.207650390799!2d-47.419004225255954!3d-23.416864956298408!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94cf5f1964786f29%3A0x580ab0956893da7!2sRua%20Elisa%20Bramante%20Francisco%2C%2027%20-%20%C3%89den%2C%20Sorocaba%20-%20SP%2C%2018103-080!5e0!3m2!1spt-BR!2sbr!4v1791354635662!5m2!1spt-BR!2sbr"
                  width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <div class="contact-form">
                <!-- User informations -->
                <form action="">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">

                    <!-- Purpose of the message in radios -->
                    <label>
                        <input type="radio" name="purpose" value="general">
                        General Inquiry
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="feedback">
                        Feedback
                    </label>
                    <!-- Message input field -->
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                    <!-- Newsletter chack -->
                    <label>
                        <input type="checkbox" name="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>
                    <!-- Final button -->
                    <button type="submit">Get in Touch</button>
                </form>

            </div>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-images">

                <figure>
                    <img src="images/employiee-one.jpg" alt="Employee 1">
                    <figcaption>Jhon</figcaption>
                </figure>

                <figure>
                    <img src="images/employiee-two.jpg" alt="Employee 2">
                    <figcaption>Sandy</figcaption>
                </figure>

                <figure>
                    <img src="images/employiee-three.jpg" alt="Employee 3">
                    <figcaption>Billy</figcaption>
                </figure>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Wild Water Rafting | Gabriel Veras</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube.svg" alt="YouTube Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
